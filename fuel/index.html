<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baro's Biryani</title>
<script>
// Old address: drop the old offline cache, then go to the new one. Data and settings carry over (same site).
(async () => {
  try {
    for (const r of await navigator.serviceWorker?.getRegistrations?.() || []) await r.unregister();
    for (const k of await caches?.keys?.() || []) await caches.delete(k);
  } catch {}
  location.replace('../biryani/');
})();
</script>
<p style="font:16px system-ui;padding:24px">Moved to <a href="../biryani/">Baro's Biryani</a>…</p>
